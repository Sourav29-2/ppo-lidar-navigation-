[workspace]
authors = ["Sourav29-2 <sourav9835359245@gmail.com>"]
channels = ["conda-forge", "robostack-staging"]
name = "ppo_lidar_navigation"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[activation]
env = {
    # ROS network isolation — only talk to local nodes
    ROS_LOCALHOST_ONLY = "1",

    # ─── OpenMP / threading deadlock prevention ───────────────────────────────
    # macOS loads multiple copies of libomp.dylib when both rclpy and PyTorch
    # are imported in the same process. KMP_DUPLICATE_LIB_OK=TRUE suppresses
    # the crash. Single-thread mode for BLAS/MKL prevents fork-time deadlocks.
    KMP_DUPLICATE_LIB_OK          = "TRUE",
    OMP_NUM_THREADS                = "1",
    MKL_NUM_THREADS                = "1",
    OPENBLAS_NUM_THREADS           = "1",
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
}


[tasks]
# ── Demo ─────────────────────────────────────────────────────────────────────
demo    = "python demo.py"

# ── Training ─────────────────────────────────────────────────────────────────
train   = "python training/train_phase5_safety.py"

# ── Evaluation ───────────────────────────────────────────────────────────────
eval    = "python evaluation/eval_final_phase5.py"

# ── Cleanup ───────────────────────────────────────────────────────────────────
clean   = "killall -9 gzserver gzclient rviz2 || echo 'All simulation processes stopped.'"

[dependencies]
ros-humble-turtlesim = ">=1.4.3,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-humble-joint-state-publisher = ">=2.4.0,<3"
ros-humble-joint-state-publisher-gui = ">=2.4.0,<3"
ros-humble-xacro = ">=2.1.1,<3"
scipy = ">=1.18.0,<2"
ros-humble-slam-toolbox = ">=2.6.10,<3"
ros-humble-nav2-bringup = ">=1.1.20,<2"
ros-humble-navigation2 = ">=1.1.20,<2"
ros-humble-twist-mux = ">=4.3.0,<5"
ros-humble-ros-base = ">=0.10.0,<0.11"
ros-humble-rosbridge-server = ">=2.0.6,<3"
matplotlib = ">=3.11.1,<4"
libopencv = { version = "*", build = "*headless*" }
pandas = ">=3.0.5,<4"
shapely = ">=2.1.2,<3"
ros-humble-rviz2 = ">=11.2.0,<12"
ros-humble-nav2-rviz-plugins = "*"
ros-humble-gazebo-ros-pkgs = ">=3.7.0,<4"


[pypi-dependencies]
colcon-common-extensions = "*"
stable-baselines3 = ">=2.3.2,<3"
gymnasium = ">=0.29.1,<1"
tensorboard = ">=2.21.0, <3"
